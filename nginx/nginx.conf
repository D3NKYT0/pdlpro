events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=pdl_api:10m rate=20r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","service":"pdl-edge","environment":"development","logger":"nginx.access",'
        '"message":"HTTP request completed","request_id":"$upstream_http_x_request_id",'
        '"http_method":"$request_method","http_path":"$uri","http_status":$status,'
        '"duration_seconds":$request_time,"remote_addr":"$remote_addr",'
        '"bytes_sent":$body_bytes_sent,"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
    client_max_body_size 50M;

    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        set $backend_upstream http://backend:8000;
        set $asgi_upstream http://asgi:8001;
        set $frontend_upstream http://frontend_dev:3000;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.stripe.com https://sdk.mercadopago.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https://*.stripe.com https://*.mercadopago.com https://*.mercadopago.com.br https://www.youtube-nocookie.com https://hcaptcha.com https://*.hcaptcha.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self';" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location ^~ /static/ {
            alias /var/www/static/;
        }

        location ^~ /media/ {
            alias /var/www/media/;
        }

        # Geração em CPU pode ultrapassar o timeout padrão das outras APIs.
        location = /api/v1/shared/content/assistant/reply/ {
            limit_req zone=pdl_api burst=40 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_read_timeout 180s;
        }

        location ^~ /api/ {
            limit_req zone=pdl_api burst=40 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_read_timeout 60;
        }

        location ^~ /admin/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        }

        location ^~ /ws/ {
            proxy_pass $asgi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
