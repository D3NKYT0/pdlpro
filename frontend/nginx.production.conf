events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    server_tokens off;

    # O proxy externo acrescenta o cliente real ao fim de X-Forwarded-For.
    # A porta deste Nginx deve permanecer acessível somente por esse proxy confiável.
    map $http_x_forwarded_for $pdl_rate_limit_client {
        ~^(?:.*[,]\s*)?(?<pdl_last_forwarded>[^,\s]+)$ $pdl_last_forwarded;
        default $remote_addr;
    }

    limit_req_zone $pdl_rate_limit_client zone=pdl_api:10m rate=20r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    log_format json_combined escape=json
        '{"timestamp":"$time_iso8601","level":"INFO","service":"pdl-edge","environment":"production","logger":"nginx.access",'
        '"message":"HTTP request completed","request_id":"$upstream_http_x_request_id",'
        '"http_method":"$request_method","http_path":"$uri","http_status":$status,'
        '"duration_seconds":$request_time,"remote_addr":"$remote_addr",'
        '"bytes_sent":$body_bytes_sent,"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml text/xml application/xml;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        set $backend_upstream http://backend:8000;
        set $asgi_upstream http://asgi:8001;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.stripe.com https://sdk.mercadopago.com https://hcaptcha.com https://*.hcaptcha.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com https://hcaptcha.com https://*.hcaptcha.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https://*.stripe.com https://*.mercadopago.com https://*.mercadopago.com.br https://www.youtube-nocookie.com https://hcaptcha.com https://*.hcaptcha.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests;" always;

        location ^~ /static/ {
            alias /var/www/static/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location ^~ /media/ {
            alias /var/www/media/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Reserva tempo para a geração local sem alterar as outras APIs.
        location = /api/v1/shared/content/assistant/reply/ {
            limit_req zone=pdl_api burst=40 nodelay;
            proxy_pass $backend_upstream$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 180s;
        }

        # /i18n/setlang/ é a view Django de troca de idioma (admin/Swagger); sem
        # este proxy o POST cai no try_files da SPA e o nginx responde 405.
        location ~ ^/(api|admin|i18n)(/|$) {
            limit_req zone=pdl_api burst=40 nodelay;
            # $uri normalizes repeated slashes added by upstream reverse proxies.
            # Reattach the original query string after normalization.
            proxy_pass $backend_upstream$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 60s;
        }

        location ~ ^/ws(/|$) {
            proxy_pass $asgi_upstream$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
