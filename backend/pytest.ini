[pytest]
DJANGO_SETTINGS_MODULE = core.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --reuse-db
markers =
    unit: Testes unitários
    integration: Testes de integração
    architecture: Testes de arquitetura / DI
