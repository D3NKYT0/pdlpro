{% if page_obj %}<nav class="observation-pagination" aria-label="Paginação">
  <span>{{ page_obj.paginator.count }} registros · Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  <div>{% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="{% querystring page=page_obj.previous_page_number %}">Anterior</a>{% endif %}
  {% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="{% querystring page=page_obj.next_page_number %}">Próxima</a>{% endif %}</div>
</nav>{% endif %}
