<title>{{ info.seo_title }}</title>
<meta name="title" content="{{ info.seo_title }}" />
<meta name="description" content="{{ info.seo_description }}" />
<meta name="apple-mobile-web-app-title" content="{{ info.name }}" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ info.og_title }}" />
<meta property="og:description" content="{{ info.og_description }}" />
<meta property="og:image" content="{{ image }}" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ info.og_title }}" />
<meta name="twitter:description" content="{{ info.og_description }}" />
<meta name="twitter:image" content="{{ image }}" />
