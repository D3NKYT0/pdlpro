{% load static %}
<!DOCTYPE html>
<html lang="pt-br" class="pdl-docs pdl-docs--swagger">
  <head>
    {% include "pdl_docs/_head.html" %}
    <link rel="stylesheet" href="{{ swagger_ui_css }}">
    <link rel="stylesheet" href="{% static 'pdl_admin/css/docs.css' %}">
  </head>
  <body>
    {% include "pdl_docs/_topbar.html" with docs_active="swagger" %}
    <div id="swagger-ui"></div>
    <script src="{{ swagger_ui_bundle }}"></script>
    <script src="{{ swagger_ui_standalone }}"></script>
    {% if script_url %}
    <script src="{{ script_url }}"></script>
    {% else %}
    <script>
    {% include template_name_js %}
    </script>
    {% endif %}
  </body>
</html>
